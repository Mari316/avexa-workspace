services:
  postgres:
    image: postgres:17-alpine
    container_name: avexa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: avexa
      POSTGRES_PASSWORD: avexa
      POSTGRES_DB: avexa
    volumes:
      - avexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avexa -d avexa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  avexa-postgres-data:
