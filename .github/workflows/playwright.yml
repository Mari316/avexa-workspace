name: Playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avexa
          POSTGRES_PASSWORD: avexa
          POSTGRES_DB: avexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avexa -d avexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://avexa:avexa@localhost:5432/avexa_test
      ALLOW_TEST_DB_MUTATION: "true"
      BETTER_AUTH_SECRET: ci-avexa-demo-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare avexa_test
        run: npm run db:test:prepare

      - name: Typecheck web
        run: npm run check-types -w web

      - name: Typecheck Playwright
        run: npm run check-types -w @avexa/playwright

      - name: Run Playwright
        run: npm run test -w @avexa/playwright

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright/playwright-report
            playwright/test-results
          if-no-files-found: ignore
          retention-days: 7
